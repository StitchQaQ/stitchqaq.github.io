<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Three.js 地球自转+昼夜变化（时区同步）</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    #container { width: 100vw; height: 100vh; }
    .time-info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="time-info" id="timeInfo">
    本地时间：<span id="localTime"></span><br>
    太阳直射经度：<span id="sunLng"></span>°<br>
    昼夜分割：东半球（白天）/ 西半球（黑夜）
  </div>
  <div id="container"></div>

  <!-- 引入Three.js（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // 1. 初始化Three.js场景
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000); // 黑色背景模拟宇宙
    document.getElementById('container').appendChild(renderer.domElement);

    // 2. 创建地球（球体+纹理）
    // 地球参数：半径、分段数（越高越光滑）
    const earthRadius = 5;
    const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);

    // 加载高清纹理（Three.js官方CDN，稳定可访问）
    const textureLoader = new THREE.TextureLoader();
    // 地球表面纹理
    const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');
    // 地球法线纹理（增强立体感）
    const earthNormalMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg');
    // 地球高光纹理（模拟海洋反光）
    const earthSpecularMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg');

    // 地球材质（ phong材质支持光照反射）
    const earthMaterial = new THREE.MeshPhongMaterial({
      map: earthTexture,
      normalMap: earthNormalMap,
      normalScale: new THREE.Vector2(0.85, 0.85),
      specularMap: earthSpecularMap,
      specular: new THREE.Color(0x333333),
      shininess: 5
    });

    // 创建地球网格并添加到场景
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // 3. 光照系统（模拟太阳，实现昼夜）
    // 平行光（太阳光）：白色，强度1.2
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    // 环境光：弱光，避免黑夜完全黑掉
    const ambientLight = new THREE.AmbientLight(0x404040, 0.2);
    scene.add(sunLight, ambientLight);

    // 4. 相机位置
    camera.position.z = 15;

    // 5. 时区+时间计算：实时更新太阳位置（昼夜核心）
    function updateSunPosition() {
      // 获取本地当前时间
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      
      // 计算当前时间对应的太阳直射经度（核心逻辑）
      // 原理：地球每小时转15°（360°/24h），北京时间12点太阳直射120°E
      // 本地时间转UTC时间 → 计算太阳直射经度
      const utcHours = hours - (now.getTimezoneOffset() / 60); // 转UTC小时
      // 太阳直射经度 = UTC时间 × 15°/h （UTC12点直射0°，UTC0点直射180°）
      const sunLongitude = (utcHours + minutes/60 + seconds/3600) * 15;
      
      // 更新太阳光位置（太阳在地球的反方向，实现昼夜）
      // 经度转三维坐标：x轴对应经度，z轴对应纬度（简化为0°）
      const rad = THREE.MathUtils.degToRad(sunLongitude);
      sunLight.position.set(
        Math.cos(rad) * 30, // x轴：经度方向
        0,                  // y轴：纬度0°（赤道）
        Math.sin(rad) * 30  // z轴：经度方向
      );

      // 更新页面信息显示
      document.getElementById('localTime').textContent = now.toLocaleString();
      document.getElementById('sunLng').textContent = sunLongitude.toFixed(2);

      // 地球自转：匹配真实速度（24小时转360° → 每帧转0.005°）
      // 自转方向：自西向东（Y轴负方向旋转）
      earth.rotation.y += 0.005;
    }

    // 6. 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. 动画循环
    function animate() {
      requestAnimationFrame(animate);
      updateSunPosition(); // 实时更新太阳位置和地球自转
      renderer.render(scene, camera);
    }
    animate();

    // 8. 鼠标交互：拖拽旋转地球（可选）
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - lastMouseX;
      const deltaY = e.clientY - lastMouseY;
      
      // 拖拽旋转地球（X轴控制纬度，Y轴控制经度）
      earth.rotation.y += deltaX * 0.01;
      earth.rotation.x += deltaY * 0.01;
      // 限制X轴旋转（避免地球翻转）
      earth.rotation.x = THREE.MathUtils.clamp(earth.rotation.x, -Math.PI/2, Math.PI/2);
      
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mouseleave', () => isDragging = false);
  </script>
</body>
</html>
